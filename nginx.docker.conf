# =========================================================
#  KAYAD — Nginx config for the Docker Compose / container
#  deployment path (Dockerfile.frontend, docker-compose.yml).
#
#  This is deliberately separate from nginx.conf, which is a real,
#  correct config but for a different deployment model - a bare-metal
#  VPS where nginx runs directly on the host (its own header says
#  "Place at: /etc/nginx/sites-available/kayad"). That file assumes
#  things that don't exist inside this container: TLS certs at
#  /etc/letsencrypt/..., the backend reachable at 127.0.0.1 (it's a
#  separate container here, reachable by its Compose service name
#  instead), static files at /var/www/kayad/frontend/dist (this
#  Dockerfile actually copies the build to /usr/share/nginx/html), and
#  a local uploads/ filesystem path this container doesn't have access
#  to (the backend already serves its own uploads via
#  express.static("uploads") - proxied here instead of aliased).
#
#  TLS/SSL is intentionally not handled here - terminate it in front
#  of this container (a cloud load balancer, Cloudflare, or a separate
#  reverse-proxy container), not inside this minimal app-serving config.
# =========================================================

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# "backend" is the Compose service name from docker-compose.yml -
# Docker's embedded DNS resolves it to the right container on the
# shared kayad-net network.
upstream kayad_backend {
    server backend:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection      "1; mode=block";
    add_header Referrer-Policy       strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Frontend build output - matches Dockerfile.frontend's
    # COPY --from=builder /app/dist /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - send all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://kayad_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://kayad_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass         http://kayad_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_buffering    off;
    }

    # Uploads - the backend serves these itself via express.static(),
    # this container has no filesystem access to them, so proxy
    # instead of the alias nginx.conf uses for the bare-metal case.
    location /uploads/ {
        proxy_pass http://kayad_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
