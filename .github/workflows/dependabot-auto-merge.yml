name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    # Only run for Dependabot PRs
    if: |
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'check_run' && github.event.check_run.sender.login == 'dependabot[bot]')

    steps:
      - name: Check PR and CI status
        id: check-status
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.check_run?.pull_requests?.[0]?.number;
            
            if (!prNumber) {
              console.log('No PR number found in event');
              process.exit(1);
            }
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get the PR details
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            console.log(`Checking PR #${prNumber}: ${pr.title}`);
            console.log(`PR author: ${pr.user.login}`);
            console.log(`PR mergeable: ${pr.mergeable}`);
            console.log(`PR state: ${pr.state}`);

            // Only proceed if author is dependabot
            if (pr.user.login !== 'dependabot[bot]') {
              console.log('Not a Dependabot PR, skipping');
              process.exit(1);
            }

            // Check if PR is already merged
            if (pr.merged) {
              console.log('PR already merged, skipping');
              process.exit(1);
            }

            // Check if PR is mergeable
            if (pr.mergeable !== true) {
              console.log('PR is not mergeable (conflicts or other issues)');
              process.exit(1);
            }

            // Check the combined status of the PR
            const { data: status } = await github.rest.repos.getCombinedStatus({
              owner,
              repo,
              ref: pr.head.sha,
            });

            console.log(`Combined status: ${status.state}`);
            console.log('Individual statuses:');
            status.statuses.forEach(s => {
              console.log(`  - ${s.context}: ${s.state}`);
            });

            // All checks must pass
            if (status.state === 'success') {
              console.log('All checks passed! Proceeding with merge.');
            } else if (status.state === 'failure') {
              console.log('Some checks failed, cannot auto-merge');
              process.exit(1);
            } else {
              console.log('Checks still pending...');
              process.exit(1);
            }

      - name: Enable auto-merge
        if: steps.check-status.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.check_run?.pull_requests?.[0]?.number;
            
            if (!prNumber) {
              console.log('No PR number found');
              process.exit(1);
            }
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get PR node ID
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            console.log(`Enabling auto-merge for PR #${prNumber}`);

            // Enable auto-merge using GraphQL
            try {
              await github.graphql(`
                mutation enableAutoMerge($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `, {
                prId: pr.node_id
              });
              console.log('Auto-merge enabled successfully via GraphQL!');
            } catch (error) {
              console.log('GraphQL mutation failed:', error.message);
              // Fallback: try direct merge
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: pr.title
                });
                console.log('PR merged directly!');
              } catch (mergeError) {
                console.log('Direct merge failed:', mergeError.message);
                process.exit(1);
              }
            }
