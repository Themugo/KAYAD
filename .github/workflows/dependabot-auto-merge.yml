name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    # Only run for Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Enable auto-merge on Dependabot PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            if (!pr) {
              console.log('No PR found in payload');
              process.exit(0);
            }
            
            console.log(`Processing Dependabot PR #${pr.number}: ${pr.title}`);
            
            // Check if auto-merge is already enabled
            if (pr.auto_merge) {
              console.log('Auto-merge already enabled on this PR');
              process.exit(0);
            }
            
            // Enable auto-merge using GraphQL
            try {
              await github.graphql(`
                mutation enableAutoMerge($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                        mergeState
                      }
                    }
                  }
                }
              `, {
                prId: pr.node_id
              });
              console.log('✅ Auto-merge enabled successfully!');
              console.log('PR will be automatically merged by GitHub when all status checks pass.');
            } catch (error) {
              console.log('Failed to enable auto-merge:', error.message);
              process.exit(1);
            }
