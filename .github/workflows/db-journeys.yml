# Database-backed journey tests (P4). Disposable PostgreSQL service container + real repo migrations + real HTTP backend.
# NEEDS NO SECRETS: nothing here reads a repository secret or talks to Supabase/M-Pesa/Cloudinary.
# STATUS: executed locally (see docs/handover/NEXT-PHASE-20261121/CI-DB-JOURNEYS.md); this workflow file itself has NOT yet run on GitHub.
name: DB Journeys
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-journeys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      POSTGREST_VERSION: v12.2.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install redis and psql client
        run: sudo apt-get update && sudo apt-get install -y redis-server postgresql-client
      - name: Install PostgREST (pinned)
        run: |
          curl -fsSL -o postgrest.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz"
          tar -xJf postgrest.tar.xz && sudo mv postgrest /usr/local/bin/postgrest && postgrest --version
      - name: Run journeys
        run: ci/db-journeys/run.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-journey-logs
          path: |
            ci/db-journeys/out/*.log
            ci/db-journeys/out/summary.txt
          retention-days: 7
