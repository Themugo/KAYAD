name: License Compliance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'

jobs:
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            cd backend
            npm ci
          else
            npm ci
          fi

      - name: Install License Checker
        run: npm install -g license-checker

      - name: Run license check for ${{ matrix.component }}
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            cd backend
            license-checker --production --json --out ../license-report-${{ matrix.component }}.json
          else
            license-checker --production --json --out license-report-${{ matrix.component }}.json
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ matrix.component }}
          path: license-report-${{ matrix.component }}.json

      - name: Check for non-compliant licenses
        run: |
          # Parse license report - license-checker outputs object with package@version as keys
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('license-report-${{ matrix.component }}.json', 'utf8'));
            const disallowed = [];
            // Only block strong copyleft licenses (GPL, AGPL)
            // Note: We use exact matching to avoid false positives (LGPL shouldn't match GPL)
            const disallowedPatterns = ['GPL', 'AGPL', 'CPL', 'EPL', 'SSPL', 'CPAL'];
            
            // Helper to extract license identifiers from a license string
            function extractLicenses(licenseStr) {
              // Split by common delimiters and clean up
              return licenseStr
                .replace(/[()]/g, ' ')
                .split(/[\s,]+|OR|I|AND/)
                .map(l => l.trim())
                .filter(l => l.length > 0);
            }
            
            // Check if a license identifier matches a disallowed pattern exactly
            function isDisallowed(licenseId) {
              // Check for exact match (case-insensitive)
              return disallowedPatterns.some(pattern => 
                licenseId.toUpperCase() === pattern.toUpperCase()
              );
            }
            
            // license-checker outputs an object, not an array
            Object.entries(report).forEach(([pkgKey, pkgInfo]) => {
              // Extract package name from 'name@version' format
              const pkgName = pkgKey.split('@')[0];
              let licenses = pkgInfo.licenses;
              
              // Handle different license formats (string or array)
              if (typeof licenses === 'string') {
                licenses = [licenses];
              } else if (!Array.isArray(licenses)) {
                licenses = [];
              }
              
              licenses.forEach(license => {
                const licenseIds = extractLicenses(license);
                const disallowedLicenses = licenseIds.filter(isDisallowed);
                
                if (disallowedLicenses.length > 0) {
                  disallowed.push({ package: pkgName, license: license });
                }
              });
            });
            
            if (disallowed.length > 0) {
              console.log('Disallowed licenses found:');
              disallowed.forEach(d => console.log('  - ' + d.package + ': ' + d.license));
              process.exit(1);
            } else {
              console.log('All licenses are compliant.');
            }
          "

      - name: Generate license summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('license-report-${{ matrix.component }}.json', 'utf8'));
            
            const licenseSummary = {};
            // license-checker outputs an object, not an array
            Object.entries(report).forEach(([pkgKey, pkgInfo]) => {
              let licenses = pkgInfo.licenses;
              if (typeof licenses === 'string') {
                licenses = [licenses];
              } else if (!Array.isArray(licenses)) {
                licenses = ['Unknown'];
              }
              
              licenses.forEach(license => {
                licenseSummary[license] = (licenseSummary[license] || 0) + 1;
              });
            });
            
            console.log('License Summary for ${{ matrix.component }}:');
            Object.entries(licenseSummary).forEach(([license, count]) => {
              console.log('  ' + license + ': ' + count);
            });
          "

      - name: Comment PR with license findings
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('license-report-${{ matrix.component }}.json', 'utf8'));
              
              const licenseSummary = {};
              // license-checker outputs an object, not an array
              Object.entries(report).forEach(([pkgKey, pkgInfo]) => {
                let licenses = pkgInfo.licenses;
                if (typeof licenses === 'string') {
                  licenses = [licenses];
                } else if (!Array.isArray(licenses)) {
                  licenses = ['Unknown'];
                }
                
                licenses.forEach(license => {
                  licenseSummary[license] = (licenseSummary[license] || 0) + 1;
                });
              });
              
              const summary = Object.entries(licenseSummary)
                .map(([license, count]) => license + ': ' + count)
                .join('\n');
              
              const comment = '## 📜 License Compliance - ${{ matrix.component }}\n\n```\n' + summary + '\n```\n\nAll licenses are compliant with the allowed license policy.';
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error reading license report:', error);
            }
