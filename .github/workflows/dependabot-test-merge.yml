name: Dependabot Test Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-auto-merge:
    name: Run Tests and Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        id: test
        run: npm test

      - name: Enable auto-merge on Dependabot PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No PR found in payload');
              process.exit(0);
            }
            
            if (!pr.user?.login?.includes('dependabot')) {
              console.log('Not a Dependabot PR, skipping');
              process.exit(0);
            }
            
            console.log(`Processing Dependabot PR #${pr.number}: ${pr.title}`);
            
            // Check if auto-merge is already enabled
            if (pr.auto_merge) {
              console.log('Auto-merge already enabled');
              process.exit(0);
            }
            
            console.log('Tests passed, enabling auto-merge on Dependabot PR...');
            
            try {
              await github.graphql(`
                mutation enableAutoMerge($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId
                    mergeMethod: SQUASH
                    autoMergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                        mergeState
                      }
                    }
                  }
                }
              `, {
                prId: pr.node_id
              });
              console.log('✅ Auto-merge enabled successfully!');
              console.log('PR will be merged when all status checks pass.');
            } catch (error) {
              console.log('Failed to enable auto-merge:', error.message);
              core.warning('Could not enable auto-merge');
            }
