name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate Phase 6 release contract
        run: npm run validate:phase6-release

      - name: Validate frontend runtime contracts
        run: npm run validate:frontend-runtime-contracts
      - name: Validate homepage convergence
        run: npm run validate:homepage-convergence
      - name: Validate deployment readiness
        run: npm run validate:deployment-readiness
      - name: Validate Vercel CLI and deployment contract
        run: npm run validate:vercel-ci
      - name: Backend boot guard (undefined identifiers)
        run: npm run validate:backend-boot
      - name: Hero mobile asset contract
        run: npm run validate:hero-mobile-assets
      - name: Validate canonical desktop hero assets
        run: npm run validate:hero-desktop-assets
      - name: Hero admin-control contract
        run: npm run validate:hero-admin-control
      - name: Validate V14 release candidate
        run: npm run validate:v14:release-candidate
      - name: Validate V14 runtime preflight
        run: npm run validate:v14:runtime-preflight
      - name: Build production frontend
        run: npm run build
      - name: Validate dist output
        run: test -f dist/index.html && test -d dist/assets
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  smoke-test:
    name: Artifact Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
      - name: Check critical files
        run: test -s dist/index.html && find dist/assets -type f -name '*.js' | grep -q .

  deploy-vercel:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is required for production deployment; refusing to report success while production could remain stale."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is required so CI can target the intended Vercel scope without interactive linking."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is required so CI can target the intended Vercel project without interactive linking."; exit 1; }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install repository dependencies
        run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install -g vercel@60.1.3
      - name: Verify Vercel CLI
        run: vercel --version
      - name: Link intended Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel link --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Pull Vercel production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
      - name: Build with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
      - name: Deploy production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID")
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          test -n "$DEPLOYMENT_URL" || { echo "::error::Vercel did not return a usable HTTPS deployment URL"; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed production
        run: npm run verify:production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PUBLIC_URL: https://www.kayad.space
          API_URL: https://api.kayad.space
