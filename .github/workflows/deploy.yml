name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend runtime contracts
        run: npm run validate:frontend-runtime-contracts
      - name: Validate deployment readiness
        run: npm run validate:deployment-readiness
      - name: Build production frontend
        run: npm run build
      - name: Validate dist output
        run: test -f dist/index.html && test -d dist/assets
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  smoke-test:
    name: Artifact Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/
      - name: Check critical files
        run: test -s dist/index.html && find dist/assets -type f -name '*.js' | grep -q .

  deploy-vercel:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Vercel deployment credentials
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "::error::VERCEL_TOKEN is required for production deployment; refusing to report success while production could remain stale."; exit 1; }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          test -n "$DEPLOYMENT_URL" || { echo "::error::Vercel did not return a deployment URL"; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed production
        run: npm run verify:production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PUBLIC_URL: https://kayad.space
          API_URL: https://api.kayad.space
