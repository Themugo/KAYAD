name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF advisory) is
          # allowlisted here after investigation: this app is a
          # client-only Vite SPA using zero React Server Components, so
          # the advisory doesn't apply to how it's actually used. The
          # suggested fix (npm audit fix --force) downgrades to
          # react-router-dom@7.11.0, which carries 9 vulnerabilities
          # instead of 1 - a regression, not a fix - and no patched
          # version exists yet that resolves this without introducing
          # worse issues. Any OTHER high/critical advisory still fails
          # the build normally; this only allowlists this one, specific,
          # already-triaged finding.
          ALLOWLIST="GHSA-qwww-vcr4-c8h2"
          npm audit --json > /tmp/audit.json 2>/dev/null || true
          RESULT=$(python3 - "$ALLOWLIST" << 'PYEOF'
          import json, sys
          allowlist = set(sys.argv[1].split())
          with open('/tmp/audit.json') as f:
              data = json.load(f)
          all_advisory_ids = set()
          high_crit_packages = []
          for name, v in data.get('vulnerabilities', {}).items():
              sev = v.get('severity')
              has_direct = False
              for via in v.get('via', []):
                  if isinstance(via, dict) and via.get('url'):
                      gid = via['url'].rstrip('/').split('/')[-1]
                      all_advisory_ids.add(gid)
                      has_direct = True
              if sev in ('high', 'critical'):
                  high_crit_packages.append(name)
          unexpected = all_advisory_ids - allowlist
          if unexpected:
              print("FAIL:unexpected_advisory:" + ",".join(sorted(unexpected)))
          elif high_crit_packages and not all_advisory_ids:
              print("FAIL:unverifiable:" + ",".join(high_crit_packages))
          else:
              print("PASS")
          PYEOF
          )
          if [[ "$RESULT" == PASS ]]; then
            echo "No unexpected high/critical vulnerabilities (GHSA-qwww-vcr4-c8h2 allowlisted, see above)."
          else
            echo "::error::Dependency audit failed: $RESULT"
            echo "Run 'npm audit' locally to see full details."
            exit 1
          fi

      - name: Check for secrets in code
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY\|mongodb+srv\|MONGO_URI" src/ --include="*.jsx" --include="*.js" --include="*.ts"; then
            echo "ERROR: Found potential secrets in source code"
            exit 1
          fi
          echo "No secrets found in source code"

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check bundle size
        run: |
          MAIN_JS=$(find dist/assets -name "*.js" -not -name "*.map" | xargs ls -la | sort -k5 -n | tail -1)
          echo "Largest JS bundle: $MAIN_JS"
          SIZE=$(find dist/assets -name "*.js" | xargs du -sk | awk '{sum += $1} END {print sum}')
          echo "Total JS size: ${SIZE}K"
          if [ "$SIZE" -gt "2000" ]; then
            echo "WARNING: Total bundle size exceeds 2MB (${SIZE}K)"
          else
            echo "Bundle size OK (${SIZE}K)"
          fi
