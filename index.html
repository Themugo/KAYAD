<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KAYAD — Kenya's Premium Car Marketplace. Buy, sell, and auction vehicles with confidence. Secure M-Pesa escrow and live auctions." />
    <meta name="theme-color" content="#07090C" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.kayad.space/" />
    <meta property="og:title" content="KAYAD — Kenya's Premium Car Marketplace" />
    <meta property="og:description" content="Buy, sell, and auction vehicles with confidence. Secure M-Pesa escrow and live auctions." />
    <meta property="og:image" content="https://www.kayad.space/og-image.jpg" />
    <meta property="og:site_name" content="KAYAD" />
    <meta property="og:locale" content="en_KE" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kayadke" />
    <meta name="twitter:title" content="KAYAD — Kenya's Premium Car Marketplace" />
    <meta name="twitter:description" content="Buy, sell, and auction vehicles with confidence. Secure M-Pesa escrow and live auctions." />
    <meta name="twitter:image" content="https://www.kayad.space/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.kayad.space/" />
    
    <!-- Security headers (CSP, X-Frame-Options, Permissions-Policy, etc.) are set as real
         HTTP response headers in vercel.json — the single source of truth for this app.
         They are intentionally NOT duplicated here as <meta> tags: frame-ancestors and
         X-Frame-Options are ignored/invalid inside <meta>, and a second, divergent CSP
         delivered via <meta> would be enforced ON TOP OF the HTTP header (intersection of
         both policies), which previously blocked legitimate Supabase requests. -->
    
    <title>KAYAD — Kenya's Premium Car Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
