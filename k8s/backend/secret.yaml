# R23 fix (KAYAD Phase 38): the previous one-line hint here showed only 2 of
# the 15 keys backend/deployment.yaml actually reads via secretKeyRef. A
# deployer who copy-pasted it literally would under-provision this Secret,
# and every key referenced by deployment.yaml that isn't marked `optional:
# true` there causes CreateContainerConfigError at pod creation (the pod
# never starts) if the key is missing from this object — not just a
# misconfigured value. The full real command is below; keep it in sync with
# deployment.yaml's secretKeyRef list if that list changes.
apiVersion: v1
kind: Secret
metadata:
  name: kayad-secrets
  namespace: kayad
type: Opaque
# Secrets managed externally. Apply with the real values, e.g.:
#   kubectl create secret generic kayad-secrets -n kayad \
#     --from-literal=supabase-url=... \
#     --from-literal=supabase-service-key=... \
#     --from-literal=redis-url=... \
#     --from-literal=jwt-secret=... \
#     --from-literal=refresh-token-secret=... \
#     --from-literal=session-secret=... \
#     --from-literal=brevo-api-key=... \
#     --from-literal=mpesa-consumer-key=... \
#     --from-literal=mpesa-consumer-secret=... \
#     --from-literal=mpesa-passkey=... \
#     --from-literal=mpesa-shortcode=... \
#     --from-literal=cloudinary-cloud-name=... \
#     --from-literal=cloudinary-api-key=... \
#     --from-literal=cloudinary-api-secret=... \
#     --from-literal=sentry-dsn=...   # optional — pod starts without it
stringData: {}
