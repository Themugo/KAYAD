apiVersion: apps/v1
kind: Deployment
metadata:
  name: kayad-backend
  namespace: kayad
  labels:
    app: kayad-backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kayad-backend
  template:
    metadata:
      labels:
        app: kayad-backend
        version: v1
    spec:
      containers:
      - name: kayad-backend
        image: kayad-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        # R23 fix (KAYAD Phase 38): previously this deployment never consumed
        # k8s/backend/configmap.yaml at all. Wiring it here supplies
        # FRONTEND_URL/BACKEND_URL/BREVO_FROM_EMAIL, which backend/utils/env.js's
        # validateEnv() hard-requires in production — without them every pod
        # called process.exit(1) before the HTTP server bound to its port.
        # Explicit `env:` entries below still take precedence over same-named
        # ConfigMap keys (NODE_ENV/PORT), so this is additive, not a behavior
        # change to anything already working.
        envFrom:
        - configMapRef:
            name: kayad-backend-config
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        # R23 fix (KAYAD Phase 38): REFRESH_TOKEN_SECRET, SESSION_SECRET and
        # BREVO_API_KEY are also hard-required by validateEnv() in production
        # and were previously absent from this manifest entirely. Added as
        # secretKeyRef entries alongside the other real secrets below — see
        # k8s/backend/secret.yaml for the full set of keys this Secret object
        # must be created with.
        - name: REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: refresh-token-secret
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: session-secret
        - name: BREVO_API_KEY
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: brevo-api-key
        - name: MPESA_SHORTCODE
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: mpesa-shortcode
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: supabase-url
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: supabase-service-key
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: jwt-secret
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: sentry-dsn
              optional: true
        - name: MPESA_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: mpesa-consumer-key
        - name: MPESA_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: mpesa-consumer-secret
        - name: MPESA_PASSKEY
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: mpesa-passkey
        - name: CLOUDINARY_CLOUD_NAME
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: cloudinary-cloud-name
        - name: CLOUDINARY_API_KEY
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: cloudinary-api-key
        - name: CLOUDINARY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: kayad-secrets
              key: cloudinary-api-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: kayad-uploads-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kayad-backend
              topologyKey: kubernetes.io/hostname
