components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
    SuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          description: User email
        password:
          type: string
          format: password
          minLength: 8
          description: User password
    LoginResponse:
      type: object
      required:
      - token
      - refreshToken
      - user
      properties:
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Refresh token
        user:
          $ref: '#/components/schemas/User'
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - name
      - phone
      properties:
        email:
          type: string
          format: email
          description: User email
        password:
          type: string
          format: password
          minLength: 8
          description: User password
        name:
          type: string
          description: User full name
        phone:
          type: string
          description: User phone number
    RegisterResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
        message:
          type: string
          description: Registration message
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token
    User:
      type: object
      required:
      - id
      - email
      - name
      - role
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          format: email
          description: User email
        name:
          type: string
          description: User name
        phone:
          type: string
          description: User phone
        role:
          type: string
          enum:
          - user
          - seller
          - admin
          - inspector
          description: User role
        emailVerified:
          type: boolean
          description: Email verification status
        profilePicture:
          type: string
          description: Profile picture URL
        location:
          type: string
          description: User location
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    Car:
      type: object
      required:
      - id
      - title
      - price
      - mileage
      - year
      - make
      - model
      - status
      properties:
        id:
          type: string
          description: Car ID
        title:
          type: string
          description: Car title
        description:
          type: string
          description: Car description
        price:
          type: number
          description: Car price in KES
        mileage:
          type: number
          description: Car mileage in km
        year:
          type: integer
          description: Car year
        make:
          type: string
          description: Car make
        model:
          type: string
          description: Car model
        transmission:
          type: string
          enum:
          - automatic
          - manual
          description: Transmission type
        fuelType:
          type: string
          description: Fuel type
        bodyType:
          type: string
          description: Body type
        color:
          type: string
          description: Car color
        location:
          type: string
          description: Car location
        images:
          type: array
          items:
            type: string
          description: Car image URLs
        features:
          type: array
          items:
            type: string
          description: Car features
        status:
          type: string
          enum:
          - active
          - sold
          - pending
          - inactive
          description: Car status
        seller:
          $ref: '#/components/schemas/User'
        verification:
          type: object
          properties:
            verified:
              type: boolean
            verifiedBy:
              type: string
            verifiedAt:
              type: string
              format: date-time
          description: Verification status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    CreateCarRequest:
      type: object
      required:
      - title
      - price
      - mileage
      - year
      - make
      - model
      - images
      properties:
        title:
          type: string
          description: Car title
        description:
          type: string
          description: Car description
        price:
          type: number
          description: Car price in KES
        mileage:
          type: number
          description: Car mileage in km
        year:
          type: integer
          description: Car year
        make:
          type: string
          description: Car make
        model:
          type: string
          description: Car model
        transmission:
          type: string
          enum:
          - automatic
          - manual
          description: Transmission type
        fuelType:
          type: string
          description: Fuel type
        bodyType:
          type: string
          description: Body type
        color:
          type: string
          description: Car color
        location:
          type: string
          description: Car location
        images:
          type: array
          items:
            type: string
          description: Car image URLs
        features:
          type: array
          items:
            type: string
          description: Car features
    UpdateCarRequest:
      type: object
      properties:
        title:
          type: string
          description: Car title
        description:
          type: string
          description: Car description
        price:
          type: number
          description: Car price in KES
        mileage:
          type: number
          description: Car mileage in km
        year:
          type: integer
          description: Car year
        make:
          type: string
          description: Car make
        model:
          type: string
          description: Car model
        transmission:
          type: string
          enum:
          - automatic
          - manual
          description: Transmission type
        fuelType:
          type: string
          description: Fuel type
        bodyType:
          type: string
          description: Body type
        color:
          type: string
          description: Car color
        location:
          type: string
          description: Car location
        images:
          type: array
          items:
            type: string
          description: Car image URLs
        features:
          type: array
          items:
            type: string
          description: Car features
        status:
          type: string
          enum:
          - active
          - sold
          - pending
          - inactive
          description: Car status
    CarResponse:
      type: object
      required:
      - car
      properties:
        car:
          $ref: '#/components/schemas/Car'
    CarListResponse:
      type: object
      required:
      - cars
      - pagination
      properties:
        cars:
          type: array
          items:
            $ref: '#/components/schemas/Car'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    Auction:
      type: object
      required:
      - id
      - carId
      - status
      - startTime
      - endTime
      - startingBid
      - highestBid
      properties:
        id:
          type: string
          description: Canonical vehicle/car ID used as the auction ID
        carId:
          type: string
          description: Canonical vehicle/car ID; same value as id
        car:
          $ref: '#/components/schemas/Car'
        status:
          type: string
          enum:
          - draft
          - active
          - ended
          description: Public auction status derived from cars.auctionStatus and auctionEnd
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        startingBid:
          type: number
          description: Starting bid in KES
        highestBid:
          type: number
          description: Current highest bid in KES
        bidCount:
          type: integer
        bidIncrement:
          type: number
        reservePrice:
          type: number
          nullable: true
        highestBidderId:
          type: string
          nullable: true
        allowBid:
          type: boolean
        allowBuy:
          type: boolean
    AuctionResponse:
      type: object
      required:
      - auction
      properties:
        auction:
          $ref: '#/components/schemas/Auction'
    AuctionListResponse:
      type: object
      required:
      - auctions
      - pagination
      properties:
        auctions:
          type: array
          items:
            $ref: '#/components/schemas/Auction'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    Bid:
      type: object
      required:
      - id
      - auctionId
      - userId
      - amount
      - timestamp
      properties:
        id:
          type: string
          description: Bid ID
        auctionId:
          type: string
          description: Auction ID
        userId:
          type: string
          description: User ID
        amount:
          type: number
          description: Bid amount in KES
        timestamp:
          type: string
          format: date-time
          description: Bid timestamp
    PlaceBidRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          description: Bid amount in KES
    BidResponse:
      type: object
      required:
