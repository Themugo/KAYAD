  <g fill="#F8F3D8" opacity=".85">
    <ellipse cx="546" cy="119" rx="27" ry="6"/><ellipse cx="784" cy="172" rx="24" ry="5"/>
    <ellipse cx="1280" cy="148" rx="25" ry="5"/><ellipse cx="1527" cy="111" rx="27" ry="6"/>
  </g>

  <!-- Broad asphalt carriageway with perspective and lane markings -->
  <path d="M-100 1000 245 615Q490 520 960 515Q1430 520 1675 615L2020 1000Z" fill="url(#asphalt)"/>
  <path d="M-100 1000 245 615Q490 520 960 515Q1430 520 1675 615L2020 1000Z" fill="url(#roadgrain)"/>
  <path d="M-100 1000 245 615Q490 520 960 515Q1430 520 1675 615L2020 1000" fill="none" stroke="#B8C3C5" stroke-width="15" opacity=".8"/>
  <path d="M-100 1000 245 615Q490 520 960 515Q1430 520 1675 615L2020 1000" fill="none" stroke="#F7F5E9" stroke-width="5" opacity=".95"/>
  <path d="M960 535 960 1000" stroke="#F7F5E9" stroke-width="7" stroke-dasharray="42 38" opacity=".9"/>
  <path d="M565 555 300 1000M1355 555 1620 1000" stroke="#F7F5E9" stroke-width="7" stroke-dasharray="40 40" opacity=".8"/>
  <path d="M0 850Q260 720 510 660" fill="none" stroke="#9CAEB2" stroke-width="4" opacity=".24"/>
  <path d="M1920 850Q1660 720 1410 660" fill="none" stroke="#9CAEB2" stroke-width="4" opacity=".24"/>

  <!-- Safety barriers and edge reflectors -->
  <path d="M0 610Q220 540 440 535" fill="none" stroke="#D6DFDC" stroke-width="18"/>
  <path d="M1480 535Q1700 540 1920 610" fill="none" stroke="#D6DFDC" stroke-width="18"/>
  <path d="M0 620Q220 550 440 545" fill="none" stroke="#7E9298" stroke-width="7"/>
  <path d="M1480 545Q1700 550 1920 620" fill="none" stroke="#7E9298" stroke-width="7"/>
  <g fill="#F6E7A8">
    <circle cx="105" cy="585" r="5"/><circle cx="205" cy="563" r="5"/><circle cx="310" cy="548" r="5"/>
    <circle cx="1610" cy="548" r="5"/><circle cx="1715" cy="563" r="5"/><circle cx="1815" cy="585" r="5"/>
  </g>

  <!-- Gentle tonal wash keeps the real hero copy and vehicle cutouts readable -->
  <rect width="1920" height="1000" fill="#0B3440" opacity=".055"/>
</svg>
