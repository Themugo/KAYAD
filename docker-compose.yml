# docker-compose.yml — KAYAD Automotive Marketplace
# Usage: docker compose up -d
# Requires: .env file with SUPABASE_*, MPESA_*, JWT_SECRET

version: "3.9"

services:

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kayad-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - kayad-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (served by nginx) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kayad-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kayad-net

networks:
  kayad-net:
    driver: bridge
