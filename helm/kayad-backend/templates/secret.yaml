apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kayad-backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if .Values.secrets.supabaseUrl }}
  supabase-url: {{ .Values.secrets.supabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseServiceKey }}
  supabase-service-key: {{ .Values.secrets.supabaseServiceKey | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- /* R23 fix (KAYAD Phase 38): see values.yaml's comment on these three keys. */}}
  {{- if .Values.secrets.refreshTokenSecret }}
  refresh-token-secret: {{ .Values.secrets.refreshTokenSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.sessionSecret }}
  session-secret: {{ .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.brevoApiKey }}
  brevo-api-key: {{ .Values.secrets.brevoApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mpesaShortcode }}
  mpesa-shortcode: {{ .Values.secrets.mpesaShortcode | quote }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | quote }}
  {{- end }}
  {{- if .Values.secrets.mpesaConsumerKey }}
  mpesa-consumer-key: {{ .Values.secrets.mpesaConsumerKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mpesaConsumerSecret }}
  mpesa-consumer-secret: {{ .Values.secrets.mpesaConsumerSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.mpesaPasskey }}
  mpesa-passkey: {{ .Values.secrets.mpesaPasskey | quote }}
  {{- end }}
  {{- if .Values.secrets.cloudinaryCloudName }}
  cloudinary-cloud-name: {{ .Values.secrets.cloudinaryCloudName | quote }}
  {{- end }}
  {{- if .Values.secrets.cloudinaryApiKey }}
  cloudinary-api-key: {{ .Values.secrets.cloudinaryApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.cloudinaryApiSecret }}
  cloudinary-api-secret: {{ .Values.secrets.cloudinaryApiSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.emailSmtpHost }}
  email-smtp-host: {{ .Values.secrets.emailSmtpHost | quote }}
  {{- end }}
  {{- if .Values.secrets.emailSmtpPort }}
  email-smtp-port: {{ .Values.secrets.emailSmtpPort | quote }}
  {{- end }}
  {{- if .Values.secrets.emailSmtpUser }}
  email-smtp-user: {{ .Values.secrets.emailSmtpUser | quote }}
  {{- end }}
  {{- if .Values.secrets.emailSmtpPassword }}
  email-smtp-password: {{ .Values.secrets.emailSmtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.smsApiKey }}
  sms-api-key: {{ .Values.secrets.smsApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.smsApiSecret }}
  sms-api-secret: {{ .Values.secrets.smsApiSecret | quote }}
  {{- end }}
