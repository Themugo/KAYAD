# Default values for kayad-backend
replicaCount: 3

image:
  repository: kayad-backend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.kayad.space
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - kayad-backend
          topologyKey: kubernetes.io/hostname

env:
  NODE_ENV: "production"
  MPESA_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  ENABLE_OTEL: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  # R23 fix (KAYAD Phase 38): backend/utils/env.js's validateEnv() hard-requires
  # these in production (confirmed by running it directly — see
  # KAYAD_PHASE38_GAP_AND_RISK_REGISTER.md R23); they were entirely absent from
  # this chart before, so every pod deployed with prior defaults would call
  # process.exit(1) before binding to its port. Left empty here deliberately —
  # an empty string is still "missing" to validateEnv(), so a deployer MUST
  # override these (they are public values, not secrets, hence here rather
  # than under `secrets:` below).
  FRONTEND_URL: ""
  BACKEND_URL: ""
  BREVO_FROM_EMAIL: ""
  # Phase 39 R25: set to actual trusted ingress/proxy peer CIDRs; blank is fail-closed.
  MPESA_TRUSTED_PROXY_CIDRS: ""

secrets:
  supabaseUrl: ""
  supabaseServiceKey: ""
  redisUrl: ""
  jwtSecret: ""
  # R23 fix (KAYAD Phase 38): also hard-required by validateEnv() in
  # production; previously absent from this chart entirely.
  refreshTokenSecret: ""
  sessionSecret: ""
  brevoApiKey: ""
  sentryDsn: ""
  mpesaConsumerKey: ""
  mpesaConsumerSecret: ""
  mpesaPasskey: ""
  # R23 fix (KAYAD Phase 38): MPESA_SHORTCODE is required alongside the three
  # M-Pesa keys above for the M-Pesa integration to actually function
  # end-to-end (the backend has no fallback); previously absent.
  mpesaShortcode: ""
  cloudinaryCloudName: ""
  cloudinaryApiKey: ""
  cloudinaryApiSecret: ""
  # R24 note (KAYAD Phase 38): emailSmtpHost/Port/User/Password and
  # smsApiKey/smsApiSecret below are never read by any backend code under
  # these names (grepped the full backend source — zero matches). They create
  # a Kubernetes Secret key that nothing consumes: filling them in gives no
  # functional email/SMS behavior. The backend's real env vars for these
  # providers are BREVO_API_KEY/BREVO_FROM_EMAIL (email, now wired above) and
  # TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN/TWILIO_WHATSAPP_NUMBER plus
  # AT_API_KEY/AT_USERNAME (SMS/WhatsApp — not yet modeled in this chart at
  # all). Left in place rather than silently deleted, since a deployer's
  # existing values file may already set them — flagging for your decision on
  # whether to rename them to match real env vars or add the Twilio/Africa's
  # Talking fields this chart is currently missing.
  emailSmtpHost: ""
  emailSmtpPort: ""
  emailSmtpUser: ""
  emailSmtpPassword: ""
  smsApiKey: ""
  smsApiSecret: ""

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: "ReadWriteMany"
  size: 50Gi

supabase:
  enabled: true
  url: ""
  serviceKey: ""

redis:
  enabled: true
  host: "redis"
  port: 6379
