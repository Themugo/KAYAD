# render.yaml — KAYAD Backend
# Deploy on Render: Connect GitHub repo → Render auto-detects this file

services:
  - type: web
    name: kayad-backend
    region: oregon
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerCommand: []
    dockerContext: ./
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: noreply@kayad.space
      - key: BREVO_FROM_NAME
        value: KAYAD
      - key: BREVO_WEBHOOK_TOKEN
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_VARIABLES
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: COMMUNICATION_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kayad-redis
          property: connectionString
      - key: WEBHOIST_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  - type: keyvalue
    name: kayad-redis
    region: oregon
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
